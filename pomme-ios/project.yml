# XcodeGen spec for the iOS app (`just ios-project` generates Pemozone.xcodeproj).
# The app has no sources of its own: its executable is the `pomme-ios` Rust
# binary, which build-app.sh builds and copies in.
name: Pemozone
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # Pass your own team, e.g. `just ios-device <team id>`.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pemozone:
    type: application
    platform: iOS
    sources:
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pemozone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        # ProMotion displays (iPhone 13 Pro and later, iPad Pro) hold an app to
        # a 60 Hz minimum frame duration unless it opts out. Pemozone's Max
        # Framerate setting goes up to 120, so without this it could never be
        # reached. Horizon's iOS plist sets it too.
        CADisableMinimumFrameDurationOnPhone: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iOS prompts for local-network access before an app can reach a server
        # on the LAN, and blocks plain http to a LAN address without this. Both
        # are needed to join a LAN world or a self-hosted server over the
        # network; internet servers use https and need neither.
        NSLocalNetworkUsageDescription: Pemozone joins Minecraft servers and LAN worlds on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Pemozone
        PRODUCT_BUNDLE_IDENTIFIER: com.pemozone.client
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        # The Rust binary carries its own debug info.
        DEBUG_INFORMATION_FORMAT: dwarf
    postCompileScripts:
      - name: Build the client
        script: '"$PROJECT_DIR/build-app.sh"'
        basedOnDependencyAnalysis: false
        # So Xcode re-signs the app when the executable changes.
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
