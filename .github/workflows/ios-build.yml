name: Build Pemozone iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: pemozone-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (workflow + action pins)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ci.yml .github/workflows/ios-build.yml

      - name: Verify third-party actions are pinned to full commit SHAs
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          files = [
              pathlib.Path(".github/workflows/ci.yml"),
              pathlib.Path(".github/workflows/ios-build.yml"),
              pathlib.Path(".github/actions/setup-rust/action.yml"),
          ]
          errors = []
          for path in files:
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.match(r"^\s*uses:\s*([^\s#]+)", line)
                  if not match:
                      continue
                  action = match.group(1)
                  if action.startswith("./"):
                      continue
                  if not re.search(r"@[0-9a-fA-F]{40}$", action):
                      errors.append(f"{path}:{number}: action is not pinned to a full 40-character SHA: {action}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("All third-party actions in the iOS build path are pinned to full commit SHAs.")
          PY

  build:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install Xcode build tools
        run: brew install xcodegen cmake

      - name: Install Rust
        run: |
          rustup toolchain install nightly-2026-08-21 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --component rust-analyzer \
            --component rust-src
          rustup target add --toolchain nightly-2026-08-21 aarch64-apple-ios

      - name: Install Vulkan SDK
        uses: jakocH/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.341.0
          install_runtime: false
          cache: true
          stripdown: true

      - name: Verify Vulkan SDK
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          test -n "$VULKAN_SDK"
          test -f "$VULKAN_SDK/share/vulkan/registry/vk.xml"
          test -d "$VULKAN_SDK/lib"

      - name: Cache MoltenVK
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/moltenvk
          key: moltenvk-1.4.2-ios-${{ hashFiles('tools/fetch_moltenvk.py') }}

      - name: Generate Xcode project
        run: xcodegen generate --quiet
        working-directory: pomme-ios

      - name: Build unsigned iOS app
        run: |
          # aws-lc-sys builds a host-side C probe while Cargo runs from Xcode.
          # Xcode exports the iPhoneOS SDKROOT, which is wrong for that macOS probe.
          cat > "$RUNNER_TEMP/clang-macos-sdk" <<'EOF'
          #!/bin/sh
          exec xcrun --sdk macosx clang "$@"
          EOF
          chmod +x "$RUNNER_TEMP/clang-macos-sdk"
          export CC_aarch64_apple_darwin="$RUNNER_TEMP/clang-macos-sdk"

          # bash cannot export a name containing hyphens, so the hyphenated
          # spelling cc-rs also reads is passed through env instead.
          env "CC_aarch64-apple-darwin=$RUNNER_TEMP/clang-macos-sdk" \
            xcodebuild \
              -project pomme-ios/Pemozone.xcodeproj \
              -scheme Pemozone \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Pemozone.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Pemozone.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Pemozone-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Pemozone-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pemozone-iOS-unsigned
          path: Pemozone-unsigned.ipa
          if-no-files-found: error

      - name: Verify IPA
        run: |
          set -euo pipefail
          IPA="Pemozone-unsigned.ipa"
          test -s "$IPA"
          echo "IPA size: $(wc -c < "$IPA") bytes"
          
          # Verify bundle structure
          unzip -l "$IPA" | grep -q "Payload/Pemozone.app/" || { echo "ERROR: Missing Payload/Pemozone.app/"; exit 1; }
          
          # Extract and verify Info.plist
          unzip -p "$IPA" "Payload/Pemozone.app/Info.plist" > /tmp/Info.plist
          plutil -p /tmp/Info.plist | grep -q "CFBundleDisplayName.*Pemozone" || { echo "ERROR: CFBundleDisplayName not Pemozone"; exit 1; }
          plutil -p /tmp/Info.plist | grep -q "CFBundleIdentifier.*com.pemozone.client" || { echo "ERROR: CFBundleIdentifier not com.pemozone.client"; exit 1; }
          plutil -p /tmp/Info.plist | grep -q "UIFileSharingEnabled.*\(true\|1\)" || { echo "ERROR: UIFileSharingEnabled not true"; exit 1; }
          plutil -p /tmp/Info.plist | grep -q "LSSupportsOpeningDocumentsInPlace.*\(true\|1\)" || { echo "ERROR: LSSupportsOpeningDocumentsInPlace not true"; exit 1; }
          
          # Verify ARM64 executable
          unzip -p "$IPA" "Payload/Pemozone.app/Pemozone" > /tmp/Pemozone_exec
          file /tmp/Pemozone_exec | grep -q "Mach-O 64-bit arm64" || { echo "ERROR: Executable not ARM64"; exit 1; }
          
          # Verify frameworks
          unzip -l "$IPA" | grep -q "Frameworks/soft_oal.framework" || { echo "ERROR: Missing soft_oal.framework"; exit 1; }
          
          echo "✅ IPA verification passed"

      - name: Delete ALL existing GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Fetching all releases..."
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isLatest,isPrerelease --jq '.[] | "\(.tagName) \(.isLatest) \(.isPrerelease)"' | while read -r tag latest prerelease; do
            echo "Deleting release: $tag (latest=$latest, prerelease=$prerelease)"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || echo "Failed to delete $tag (may not exist)"
          done
          echo "All releases deleted"

      - name: Publish IPA to GitHub Release (replaces all previous)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v3.0.0-build-${GITHUB_RUN_NUMBER}"
          IPA="Pemozone-unsigned.ipa"
          
          gh release create "$TAG" "$IPA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pemozone 3.0 (build #${GITHUB_RUN_NUMBER})" \
            --notes "Pemozone 3.0: Touch Layout editor with Hide/Show panel, iOS keyboard IME support, Shader Packs UI, Entity Shadows toggle, Simulation Distance enabled, Documents/shaderpacks for Files app access.\n\nExperimental iOS build produced by GitHub Actions.\n\n- Build: successful\n- Platform: iOS / Apple Silicon (ARM64)\n- Status: **Unsigned IPA** (not code-signed)\n- Files App: Documents folder exposed (UIFileSharingEnabled + LSSupportsOpeningDocumentsInPlace)\n- Shaderpacks: Accessible via On My iPhone/iPad → Pemozone → shaderpacks/\n\n**This release replaces ALL previous releases.**" \
            --prerelease
          echo "✅ Release created: $TAG"
